<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Homo Sapiens — O Ser Humano · Lâmina I</title>
<meta name="description" content="Homo Sapiens · O Ser Humano — lâmina naturalista. Atlas da Natureza, Tomo III.">

<meta property="og:title" content="Homo Sapiens — O Ser Humano">
<meta property="og:description" content="Lâmina naturalista · Atlas da Natureza, Tomo III.">
<meta property="og:image" content="https://res.cloudinary.com/dnnnn7njk/image/upload/f_auto,q_auto/v1787838617/atlas_bc853a.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141210;
    --frame:#3a332b;
    --gold:#b89968;
    --ink:#e9e0cf;
    --ink-soft:#a99f8d;
    --faded:#7d7462;
    --maxw:760px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(140% 90% at 50% 0%, #211d19 0%, var(--bg) 60%, #0e0c0a 100%);
    color:var(--ink);
    font-family:"EB Garamond",Georgia,serif;
    line-height:1.6;min-height:100%;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }

  main{position:relative;z-index:1;flex:1;width:100%;max-width:var(--maxw);margin:0 auto;padding:clamp(24px,6vw,64px) clamp(16px,4vw,32px) clamp(40px,8vw,80px);text-align:center;}

  .kicker{font-family:"Cormorant Garamond",serif;letter-spacing:.34em;text-transform:uppercase;font-size:.72rem;color:var(--gold);margin:0 0 1.1rem;padding-left:.34em;}
  h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(2rem,7.5vw,3.1rem);letter-spacing:.02em;line-height:1;margin:0;}
  .sub{font-family:"Cormorant Garamond",serif;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(.72rem,2.6vw,.85rem);color:var(--ink-soft);margin:.7rem 0 0;padding-left:.3em;}
  .rule{width:64px;height:0;border:0;border-top:1px solid var(--frame);margin:1.5rem auto;}

  .frame{
    margin:clamp(8px,2vw,20px) auto 0;padding:clamp(10px,2.5vw,20px);
    background:linear-gradient(180deg,#241f1a,#1a1613);
    border:1px solid var(--frame);
    box-shadow:inset 0 0 0 1px rgba(184,153,104,.14),inset 0 0 40px rgba(0,0,0,.6),0 30px 70px -30px rgba(0,0,0,.9);
    border-radius:2px;cursor:zoom-in;position:relative;
  }
  .frame img{display:block;width:100%;height:auto;border-radius:1px;box-shadow:0 6px 24px -8px rgba(0,0,0,.7);}
  .frame .hint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-family:"Cormorant Garamond",serif;letter-spacing:.18em;text-transform:uppercase;
    font-size:.62rem;color:var(--ink);background:rgba(20,16,12,.7);
    padding:6px 12px;border:1px solid rgba(184,153,104,.3);border-radius:100px;
    backdrop-filter:blur(4px);opacity:.9;pointer-events:none;
  }

  .plaque{margin:clamp(22px,5vw,38px) auto 0;max-width:52ch;}
  .plaque .title{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.15rem;color:var(--ink);margin:0;}
  .plaque .meta{font-size:.9rem;color:var(--ink-soft);margin:.35rem 0 0;}
  .plaque .desc{font-size:.95rem;color:var(--faded);margin:1rem 0 0;font-style:italic;line-height:1.6;}

  footer{position:relative;z-index:1;text-align:center;padding:0 0 clamp(24px,5vw,40px);}
  footer .brand{font-family:"Cormorant Garamond",serif;letter-spacing:.28em;text-transform:uppercase;font-size:.78rem;color:var(--ink-soft);}
  footer .year{font-family:"Cormorant Garamond",serif;color:var(--faded);font-size:.72rem;letter-spacing:.2em;margin-top:.25rem;}

  .lightbox{position:fixed;inset:0;z-index:50;display:none;background:rgba(8,7,6,.96);overflow:auto;-webkit-overflow-scrolling:touch;cursor:zoom-out;}
  .lightbox.open{display:block;}
  .lightbox img{display:block;margin:0 auto;width:auto;max-width:none;min-height:100%;}
  .lightbox .close{position:fixed;top:14px;right:16px;z-index:51;width:44px;height:44px;border-radius:50%;border:1px solid rgba(184,153,104,.4);background:rgba(20,16,12,.7);color:var(--ink);font-size:1.4rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  .lightbox .lb-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:51;font-family:"Cormorant Garamond",serif;letter-spacing:.16em;text-transform:uppercase;font-size:.64rem;color:var(--ink-soft);background:rgba(20,16,12,.7);padding:6px 14px;border:1px solid rgba(184,153,104,.25);border-radius:100px;backdrop-filter:blur(4px);}

  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  .reveal{opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease;}
  .reveal.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}
</style>
</head>
<body>

<main>
  <p class="kicker reveal">Atlas da Natureza · Tomo III — Mammalia</p>
  <h1 class="reveal">Homo Sapiens</h1>
  <p class="sub reveal">O Ser Humano · Lâmina I</p>
  <hr class="rule reveal">

  <figure class="frame reveal" id="art" tabindex="0" role="button" aria-label="Ampliar a lâmina para ler os detalhes">
    <img
      src="https://res.cloudinary.com/dnnnn7njk/image/upload/f_auto,q_auto/v1787838617/atlas_bc853a.png"
      alt="Lâmina naturalista do Homo sapiens: retrato central com cérebro, mão, baleia e galinha em comparação anatômica, a cadeia humana e a classificação científica.">
    <span class="hint">Toque para ampliar</span>
  </figure>

  <figcaption class="plaque reveal">
    <p class="title">Homo Sapiens — O Ser Humano</p>
    <p class="meta">Lâmina naturalista · gravura colorida · Tomo III, Mammalia</p>
    <p class="desc">Entre todos os mamíferos e bípedes, o ser humano se distingue pela mente que imagina e pela mão que cria.</p>
  </figcaption>
</main>

<footer class="reveal">
  <p class="brand">Atlas da Natureza</p>
  <p class="year">MDCCCLXXIX · 1879</p>
</footer>

<div class="lightbox" id="lb" aria-hidden="true">
  <button class="close" id="lbClose" aria-label="Fechar">×</button>
  <img src="https://res.cloudinary.com/dnnnn7njk/image/upload/f_auto,q_auto/v1787838617/atlas_bc853a.png" alt="Lâmina ampliada do Homo sapiens">
  <span class="lb-hint">Toque para fechar · use o zoom para ler os detalhes</span>
</div>

<script>
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
  document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(Math.min(i,5)*60)+'ms';io.observe(el);});

  const art=document.getElementById('art'), lb=document.getElementById('lb'), lbClose=document.getElementById('lbClose');
  function open(){lb.classList.add('open');lb.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function close(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  art.addEventListener('click',open);
  art.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  lb.addEventListener('click',close);
  lbClose.addEventListener('click',e=>{e.stopPropagation();close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
</script>
</body>
</html>
