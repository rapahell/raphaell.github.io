<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bolão Copa 2026 v2.0</title>

<style>
:root{--gr:#1b2e5f;--grd:#13224a;--grl:#2f4a86;--gold:#c98a0e;--ink:#142036;--mut:#5d6675;--paper:#eef1f6;--card:#fff;--line:#d6dbe6;--soft:#e3ecf8;--radius:14px;--blue:#73b4e9;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.5;}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 48px;}
h1,h2{font-weight:700;margin:0;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select{font-family:inherit;font-size:15px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.hidden{display:none!important;}
.hero{position:relative;overflow:hidden;border-radius:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(27,46,95,.22);line-height:0;}
.hero img{width:100%;height:auto;display:block;}
.badge-v2{display:inline-block;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tabs button{flex:1 1 auto;border-radius:11px;padding:11px 8px;font-size:13px;font-weight:700;background:var(--card);color:var(--mut);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;}
.tabs button.on{background:var(--gr);color:#fff;border-color:transparent;}

.sec{display:flex;align-items:center;gap:9px;margin-bottom:3px;}
.sec .ic{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--grd);display:inline-flex;align-items:center;justify-content:center;}
.sec h2{font-size:19px;}
.subt{margin:0 0 16px;font-size:13px;color:var(--mut);padding-left:37px;}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--gr);color:#fff;border-radius:11px;padding:11px 17px;font-weight:800;font-size:14px;}
.btn.ghost{background:var(--soft);color:var(--grd);}
.round{display:flex;align-items:center;gap:9px;margin:14px 0 11px;}
.round .tag{font-size:12px;font-weight:800;color:#fff;background:var(--grd);padding:3px 11px;border-radius:999px;}
.round .line{flex:1;height:1px;background:var(--line);}
.match{padding:11px 13px;}
.match.done{border-left:3px solid var(--gr);}
.meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:9px;flex-wrap:wrap;}
.meta .g{background:var(--soft);color:var(--grd);border-radius:8px;padding:2px 7px;}
.mrow{display:flex;align-items:center;gap:8px;justify-content:center;}
.side{flex:1;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;}
.side.l{justify-content:flex-end;text-align:right;}
.side.r{justify-content:flex-start;}
.fl{font-size:21px;line-height:1;}
.sc{width:42px;height:42px;text-align:center;font-size:17px;font-weight:800;border:1.5px solid var(--line);border-radius:10px;background:#fafbfa;color:var(--ink);}
.x{color:var(--mut);font-weight:800;}
.rk{display:flex;align-items:center;gap:14px;padding:15px 16px;}
.rk.lead{border:2px solid var(--gold);}
.rk .medal{font-size:22px;font-weight:900;min-width:40px;text-align:center;}
.rk .av{width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.rk.lead .av{border:3px solid var(--gold);}
.rk .pts{font-size:31px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.rk .barmini{height:6px;background:var(--soft);border-radius:999px;margin-top:8px;overflow:hidden;}
.rk .barmini>i{display:block;height:100%;border-radius:999px;}
.pts-breakdown{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.pts-breakdown span{font-size:11px;color:var(--mut);background:var(--soft);padding:2px 7px;border-radius:999px;font-weight:700;}
.rule{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;}
.rule .lft{display:flex;align-items:center;gap:11px;font-size:14px;}
.rule .ric{width:31px;height:31px;border-radius:9px;background:var(--soft);color:var(--grd);display:inline-flex;align-items:center;justify-content:center;}
.rule .pts{font-size:17px;font-weight:800;color:var(--gr);white-space:nowrap;margin-left:12px;}
.tbtn{display:flex;align-items:center;gap:7px;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:700;background:#fff;color:var(--ink);border:1px solid var(--line);}
.tbtn.on{background:var(--gr);color:#fff;border-color:transparent;}
.ko-game{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;background:#fff;}
.ko-game .team{flex:1;display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#fafbfa;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;}
.ko-game .team:hover{border-color:var(--gr);background:var(--soft);}
.ko-game .team.win{background:var(--soft);border-color:var(--gr);color:var(--grd);}
.ko-game .team.empty{color:var(--mut);font-style:italic;cursor:default;}
.ko-game .vs{font-size:11px;color:var(--mut);font-weight:800;min-width:20px;text-align:center;}
.ko-game .gnum{font-size:10px;color:var(--mut);font-weight:700;min-width:28px;}
.chav-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:5px;}
.chav-flag{font-size:18px;min-width:24px;}
.chav-name{flex:1;font-size:13px;font-weight:700;}
.chav-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.chav-badge.hit{background:#d4edda;color:#155724;}
.chav-badge.miss{background:#fde8ea;color:#721c24;}
.accordion-head{display:flex;align-items:center;gap:9px;margin:14px 0 11px;cursor:pointer;user-select:none;}
.accordion-head .tag{font-size:12px;font-weight:800;color:#fff;background:var(--grd);padding:3px 11px;border-radius:999px;}
.accordion-head .line{flex:1;height:1px;background:var(--line);}
.accordion-head .toggle{font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap;}
.score-input{width:42px;height:42px;text-align:center;font-size:17px;font-weight:800;border:1.5px solid var(--line);border-radius:10px;background:#fafbfa;color:var(--ink);}
.pen-tag{font-size:11px;font-weight:700;color:var(--gold);background:#fff8e6;border:1px solid var(--gold);border-radius:8px;padding:2px 8px;margin-top:4px;text-align:center;}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:26px 0 6px;}
@media(max-width:640px){
  .wrap{padding:12px 11px 40px;}
  .hero{border-radius:16px;}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .tabs button{padding:11px 4px;font-size:12px;min-height:46px;border-radius:12px;}
  .sec h2{font-size:17px;}
  .subt{font-size:12.5px;padding-left:0;margin-top:6px;}
  .match{padding:12px;}
  .mrow{gap:6px;}
  .side{font-size:13px;gap:5px;}
  .fl{font-size:19px;}
  .sc{width:46px;height:46px;font-size:18px;}
  .rk{gap:10px;padding:14px 13px;}
  .rk .medal{font-size:19px;min-width:32px;}
  .rk .av{width:38px;height:38px;}
  .rk .pts{font-size:27px;}
  .ko-game{flex-wrap:wrap;}
  .ko-game .gnum{flex:0 0 100%;margin-bottom:4px;}
  .ko-game .team{min-height:46px;}
  .btn{padding:13px 18px;min-height:48px;}
}
.grupo-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.grupo-tbl th,.grupo-tbl td{padding:7px 4px;}
@media(max-width:640px){
  .grupo-tbl{font-size:11px;}
  .grupo-tbl th,.grupo-tbl td{padding:6px 2px;}
  .grupo-tbl img{width:22px!important;height:22px!important;}
  .grupo-tbl td:first-child,.grupo-tbl th:first-child{padding-left:8px;}
}
@media(max-width:380px){
  .tabs{grid-template-columns:repeat(2,1fr);}
  .grupo-tbl{font-size:10px;}
}
</style>
</head>

// Conta o "peso" de dados (palpites + resultados) para detectar perda de dados
function pesoDados(db){
  if(!db)return 0;
  let n=0;
  Object.values(db.guesses||{}).forEach(g=>{
    n+=Object.keys(g.matches||{}).length;
    if(g.bracket2)Object.values(g.bracket2).forEach(f=>n+=Object.keys(f||{}).length);
  });
  n+=Object.keys(db.results?.matches||{}).length;
  if(db.results?.ko)Object.values(db.results.ko).forEach(f=>n+=Object.keys(f||{}).length);
  return n;
}

function pushDB(){
  ensure();
  const temDados=Object.keys(DB.guesses||{}).length>0||Object.keys(DB.imported||{}).length>0;
  if(!temDados)return;
  set(dbRef,DB).catch(e=>console.error(e));
}

function startSync(){
  onValue(dbRef,snap=>{
    const v=snap.val();
    if(v&&(Object.keys(v.guesses||{}).length>0||Object.keys(v.imported||{}).length>0)){
      // Proteção anti-zeramento: se já temos dados locais e o Firebase
      // mandar um peso muito menor (perda de dados), não aceita o retrocesso
      const pesoLocal=pesoDados(DB);
      const pesoRemoto=pesoDados(v);
      if(pesoLocal>0&&pesoRemoto<pesoLocal*0.5){
        // Firebase tem bem menos dados que o local — provável zeramento por aba antiga.
        // Reescreve o Firebase com os dados bons locais em vez de aceitar a perda.
        console.warn("Bloqueado retrocesso de dados (local:"+pesoLocal+" remoto:"+pesoRemoto+")");
        set(dbRef,DB).catch(e=>console.error(e));
        ensure();state.ready=true;$("#status").classList.add("hidden");render();
        return;
      }
      DB=v;
    }
    ensure();state.ready=true;$("#status").classList.add("hidden");render();
  },()=>{ensure();state.ready=true;$("#status").classList.add("hidden");render();});
}

const pg=p=>{if(!DB.guesses[p])DB.guesses[p]={matches:{},bracket:{}};if(!DB.guesses[p].bracket)DB.guesses[p].bracket={};return DB.guesses[p];};

function scoreGrupos(p){
  const g=pg(p); let pts=0,ex=0,hit=0;
  M.forEach(m=>{

    if(gh===rh&&ga===ra){pts+=5;ex++;hit++;}
    else if((gh>ga&&rh>ra)||(gh<ga&&rh<ra)||(gh===ga&&rh===ra)){pts+=2;hit++;}
  });
  return {pts,ex,hit};
}

function scoreChaveamento(p){
  const palpite=CHAV_PALPITES[p]||{};
  const ko=DB.results.ko||{};
  let pts=0,detail={};
  FASES.forEach(f=>{
    // r32: os 32 do bracket · r16: os 16 vencedores dos 16-avos (já conhecidos)
    let reaisSet;
    if(f.k==="r32")reaisSet=R32_REAL_SET;
    else if(f.k==="r16")reaisSet=r16RealSet();
    else reaisSet=new Set(Object.values(ko[f.k]||{}));
    const pSet=new Set(palpite[f.k]||[]);
    let acc=0;
    pSet.forEach(t=>{if(reaisSet.has(t))acc++;});
    const p2=acc*CHAV_PTS[f.k];
    detail[f.k]={acertos:acc,pts:p2};
    pts+=p2;
  });
  return {pts,detail};
}

function scoreFase2(p){

}

function standings(matches){
  const stat={};ALL.forEach(t=>{stat[t]={v:0,e:0,d:0,gp:0,gc:0};});
  const byGroup={};GL.forEach(g=>{byGroup[g]=[...GROUPS[g]];});
  M.forEach(m=>{
    const r=matches[m[0]]||matches["m"+m[0]];
    if(!r||r.h==null||r.h==="")return;
    const t1=m[2],t2=m[3],h=+r.h,a=+r.a;
    stat[t1].gp+=h;stat[t1].gc+=a;stat[t2].gp+=a;stat[t2].gc+=h;
    if(h>a){stat[t1].v++;stat[t2].d++;}else if(h<a){stat[t2].v++;stat[t1].d++;}else{stat[t1].e++;stat[t2].e++;}
  });
  const sc=t=>{const s=stat[t];return (3*s.v+s.e)*1e7+((s.gp-s.gc)+100)*1e4+s.gp*10;};
  GL.forEach(g=>{byGroup[g].sort((a,b)=>sc(b)-sc(a));});
  return {stat,byGroup,sc};
}

// ===== FETCH API (openfootball) =====
async function fetchAPI(silent){
  if(!silent){state.saving=true;state.apiMsg="Buscando…";render();}
  try{
    const res=await fetch("https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json");
    if(!res.ok){if(!silent||isAdmin){state.apiMsg="⚠️ Erro HTTP "+res.status;state.saving=false;render();}return;}
    const data=await res.json();
    let count=0;
    data.matches.forEach(mx=>{
      if(!mx.score||!mx.score.ft)return;
      const home=apiTeam(mx.team1),away=apiTeam(mx.team2);
      if(!home||!away)return;
      const round=mx.round||"";
      // Jogos de grupo
      if(round.indexOf("Group")>=0||round.indexOf("Matchday")>=0||round===""){
        const t=M.find(m=>m[2]===home&&m[3]===away);
        if(t){DB.results.matches["m"+t[0]]={h:String(mx.score.ft[0]),a:String(mx.score.ft[1])};count++;}
        return;
      }
      // 16-avos (Round of 32): casar pelo par de times
      if(round.indexOf("Round of 32")>=0){
        const g=R32_GAMES.find(x=>(x.home===home&&x.away===away)||(x.home===away&&x.away===home));
        if(g){
          const inv=g.home===away; // se invertido
          // Placar final: prorrogação (et) se houver, senão tempo normal (ft)
          const fin=mx.score.et||mx.score.ft;
          const h=inv?fin[1]:fin[0];
          const a=inv?fin[0]:fin[1];
          if(!DB.results.ko2)DB.results.ko2={};
          if(!DB.results.ko2.r32)DB.results.ko2.r32={};
          DB.results.ko2.r32[g.id]={h:h,a:a,pen:null};
          // marcar vencedor
          if(!DB.results.ko)DB.results.ko={};
          if(!DB.results.ko.r32)DB.results.ko.r32={};
          let venc=h>a?g.home:a>h?g.away:null;
          // pênaltis (se houver no feed)
          if(!venc&&mx.score.p){const ph=inv?mx.score.p[1]:mx.score.p[0];const pa=inv?mx.score.p[0]:mx.score.p[1];venc=ph>pa?g.home:g.away;DB.results.ko2.r32[g.id].pen=venc;}
          if(venc)DB.results.ko.r32[g.id]=venc;
          count++;
        }
      }
      // Oitavas (Round of 16): casar pelos vencedores dos 16-avos
      if(round.indexOf("Round of 16")>=0){
        // Descobrir qual oitava (id) tem esses dois times como vencedores
        for(let idx=0;idx<R16_PAIRS.length;idx++){
          const [ga,gb]=R16_PAIRS[idx];
          const tA=(DB.results.ko?.r32||{})[ga], tB=(DB.results.ko?.r32||{})[gb];
          if(!tA||!tB)continue;
          const match=(tA===home&&tB===away)||(tA===away&&tB===home);
          if(match){
            const inv=tA===away;
            const fin=mx.score.et||mx.score.ft;
            const h=inv?fin[1]:fin[0];
            const a=inv?fin[0]:fin[1];
            if(!DB.results.ko2)DB.results.ko2={};
            if(!DB.results.ko2.r16)DB.results.ko2.r16={};
            DB.results.ko2.r16[idx+1]={h:h,a:a,pen:null};
            if(!DB.results.ko.r16)DB.results.ko.r16={};
            let venc=h>a?tA:a>h?tB:null;
            if(!venc&&mx.score.p){const ph=inv?mx.score.p[1]:mx.score.p[0];const pa=inv?mx.score.p[0]:mx.score.p[1];venc=ph>pa?tA:tB;DB.results.ko2.r16[idx+1].pen=venc;}
            if(venc)DB.results.ko.r16[idx+1]=venc;
            count++;
            break;
          }
        }
      }
    });
    if(count>0)pushDB();
    let msg=count>0?"✓ "+count+" jogo(s) atualizados.":"Nenhum jogo novo.";
    if(!silent||isAdmin){state.apiMsg=msg;state.saving=false;render();}
    else if(count>0)render();
  }catch(e){if(!silent||isAdmin){state.apiMsg="⚠️ Falha: "+(e.message||e);state.saving=false;render();}}
}

// ===== PARSER DE PLANILHA =====
function handleFile(file,player){
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const ws=wb.Sheets["Placares"];if(!ws){state.impMsg="⚠️ Aba 'Placares' não encontrada.";render();return;}
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
    const matches={};let nM=0;
    rows.forEach(r=>{const num=r[0];if(typeof num==="number"&&num>=1&&num<=72){const h=r[4],a=r[5];if(h!==""&&h!=null&&a!==""&&a!=null){matches["m"+num]={h:String(h).replace(/[^\d]/g,""),a:String(a).replace(/[^\d]/g,"")};if(matches["m"+num].h)nM++;}}});
    if(!DB.guesses[player])DB.guesses[player]={matches:{},bracket:{},bracket2:{}};
    DB.guesses[player].matches=matches;
    DB.imported[player]=true;
    pushDB();
    state.impMsg="✓ "+player+": "+nM+" placares lidos.";
    render();
  };
  reader.readAsArrayBuffer(file);
}

// ===== RENDER =====
function render(){
  if(!state.ready)return;
  const app=$("#app");app.innerHTML="";
  try{
    app.appendChild(renderHeader());
    app.appendChild(renderTabs());
    const body=ce("div");
    if(state.tab==="ranking")ranking(body);
    else if(state.tab==="fase2")fase2(body);
    else if(state.tab==="fase1")fase1(body);
    else if(state.tab==="importar")importar(body);
    else if(state.tab==="regras")regras(body);
    app.appendChild(body);
  }catch(e){
    console.error("Erro ao renderizar:",e);
    const err=ce("div",{class:"card",style:"margin-top:14px;text-align:center;padding:24px"});
    err.innerHTML='<div style="font-size:15px;font-weight:700;color:var(--grd);margin-bottom:8px">Ops, algo deu errado nesta aba</div><div style="font-size:13px;color:var(--mut)">Tente recarregar a página (Cmd+Shift+R). Se persistir, troque de aba.</div>';
    app.appendChild(err);
    // botões de navegação de emergência
    const nav=ce("div",{style:"display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap"});
    ["ranking","fase2","fase1"].forEach(t=>{
      const b=ce("button",{class:"btn ghost"});b.textContent=t==="ranking"?"Ranking":t==="fase2"?"2ª Fase":"1ª Fase";
      b.onclick=()=>{state.tab=t;render();};nav.appendChild(b);
    });
    app.appendChild(nav);
  }
}

function accordionHead(body,label,key,stateObj,countStr){
  const open=stateObj[key];

  head.innerHTML='<span class="tag">'+label+(countStr?' · '+countStr:'')+'</span><span class="line"></span><span class="toggle">'+(open?'▾ ocultar':'▸ expandir')+'</span>';

  body.appendChild(head);
  return open;
}

      FASES.forEach(f=>{
        const d=s.chav.detail[f.k];
        if(d&&d.pts>0)l2.appendChild(ce("span",{style:"background:#e8f4e8;color:#1a5c1a"},faseNomes[f.k]+": +"+d.pts));

    const head=ce("div",{style:"display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer"});
    head.innerHTML=avt(p,34)+'<span style="font-size:14px;font-weight:800;flex:1">'+p+'</span><span style="font-size:16px;font-weight:800;color:var(--grd)">'+s.chav.pts+' pts</span><span style="font-size:13px;color:var(--mut);margin-left:4px">'+(state.chavAberto[p]?'▾':'▸')+'</span>';
    head.onclick=()=>{state.chavAberto[p]=!state.chavAberto[p];render();};
    wrap.appendChild(head);
    // detalhe por fase
    if(state.chavAberto[p]){
      const det=ce("div",{style:"border-top:1px solid var(--line);padding:10px 14px;background:#fafbfc"});
      const ko=DB.results.ko||{};
      FASES.forEach(f=>{
        const lista=CHAV_PALPITES[p]?.[f.k]||[];
        if(lista.length===0)return;
        const reaisSet=f.k==="r32"?R32_REAL_SET:f.k==="r16"?r16RealSet():new Set(Object.values(ko[f.k]||{}));
        const jaValendo=reaisSet.size>0; // fase já aconteceu (tem quem passou marcado)
        const acertos=lista.filter(t=>reaisSet.has(t));
        const faseNome={r32:"16-avos",r16:"Oitavas",r8:"Quartas",r4:"Semifinal",r2:"Final",champ:"Campeão"}[f.k];
        const block=ce("div",{style:"margin-bottom:11px"});
        // Cabeçalho da fase
        let cab='<div style="font-size:12px;font-weight:800;color:var(--grd);margin-bottom:5px;display:flex;align-items:center;gap:6px">'+faseNome+' <span style="font-size:10px;color:var(--mut);font-weight:600">('+CHAV_PTS[f.k]+'pts cada)</span>';
        if(jaValendo)cab+='<span style="margin-left:auto;color:var(--grd);font-weight:800">'+acertos.length+'/'+lista.length+' · +'+(acertos.length*CHAV_PTS[f.k])+'pts</span>';
        else cab+='<span style="margin-left:auto;color:var(--mut);font-weight:600;font-style:italic">aguardando</span>';
        cab+='</div>';
        block.innerHTML=cab;
        const tags=ce("div",{style:"display:flex;flex-wrap:wrap;gap:4px"});
        lista.forEach(t=>{
          const ok=jaValendo&&reaisSet.has(t);
          const errou=jaValendo&&!reaisSet.has(t);
          let bg="#eef1f6",cor="#555"; // pendente (fase não aconteceu)
          if(ok){bg="#d4edda";cor="#155724";}
          else if(errou){bg="#fde8ea";cor="#a02020";}
          tags.appendChild(ce("span",{style:"font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;background:"+bg+";color:"+cor},fl(t)+" "+t+(ok?" ✓":errou?" ✗":"")));
        });
        block.appendChild(tags);
        det.appendChild(block);
      });
      wrap.appendChild(det);
    }
    body.appendChild(wrap);
  });
}

    });
    body.appendChild(tbl);
  });

  // Jogos por rodada com acordeão
  [1,2,3].forEach(rod=>{
    const jogosRod=M.filter(m=>roundOf(m[0])===rod);
    const doneCount=jogosRod.filter(m=>{const r=DB.results.matches[m[0]]||DB.results.matches["m"+m[0]]||{};return r.h!==""&&r.a!==""&&r.h!=null&&r.a!=null;}).length;
    const open=accordionHead(body,rod+"ª RODADA",rod,state.openFase1,doneCount+"/"+jogosRod.length);
    if(!open)return;
    const box=ce("div",{style:"display:grid;gap:7px"});
    jogosRod.forEach(m=>{
      const r=DB.results.matches[m[0]]||DB.results.matches["m"+m[0]]||{};
      const done=r.h!==""&&r.a!==""&&r.h!=null&&r.a!=null;
      const H=done?+r.h:null,A=done?+r.a:null;
      const winH=done&&H>A,winA=done&&A>H,draw=done&&H===A;
      const sH=winH?"font-weight:900;color:var(--gr)":draw?"font-weight:700;color:var(--gold)":"";
      const sA=winA?"font-weight:900;color:var(--gr)":draw?"font-weight:700;color:var(--gold)":"";

      const mid=ce("div",{class:"mrow"});
      mid.appendChild(ce("span",{class:"side l",style:sH},'<span>'+m[2]+'</span><span class="fl">'+fl(m[2])+'</span>'));
      if(isAdmin){
        const i1=ce("input",{class:"score-input",type:"text",inputmode:"numeric",maxlength:"2"});i1.value=r.h==null?"":r.h;
        i1.oninput=function(){this.value=this.value.replace(/[^\d]/g,"").slice(0,2);if(!DB.results.matches["m"+m[0]])DB.results.matches["m"+m[0]]={};DB.results.matches["m"+m[0]].h=this.value;pushDB();};
        const i2=ce("input",{class:"score-input",type:"text",inputmode:"numeric",maxlength:"2"});i2.value=r.a==null?"":r.a;
        i2.oninput=function(){this.value=this.value.replace(/[^\d]/g,"").slice(0,2);if(!DB.results.matches["m"+m[0]])DB.results.matches["m"+m[0]]={};DB.results.matches["m"+m[0]].a=this.value;pushDB();};
        mid.appendChild(i1);mid.appendChild(ce("span",{class:"x"},"×"));mid.appendChild(i2);
      }else{
        const scStyle=s=>winH&&s==="h"?";background:var(--soft);border-color:var(--gr);color:var(--gr)":winA&&s==="a"?";background:var(--soft);border-color:var(--gr);color:var(--gr)":draw?";background:#fff8e6;border-color:var(--gold);color:var(--gold)":"";
        mid.appendChild(ce("span",{class:"sc",style:"display:inline-flex;align-items:center;justify-content:center"+scStyle("h")},done?r.h:"–"));
        mid.appendChild(ce("span",{class:"x"},"×"));
        mid.appendChild(ce("span",{class:"sc",style:"display:inline-flex;align-items:center;justify-content:center"+scStyle("a")},done?r.a:"–"));
      }
      mid.appendChild(ce("span",{class:"side r",style:sA},'<span class="fl">'+fl(m[3])+'</span><span>'+m[3]+'</span>'));
      row.appendChild(mid);
      if(done){const tag=draw?"Empate":winH?m[2]+" venceu":m[3]+" venceu";row.appendChild(ce("div",{style:"text-align:center;font-size:11px;font-weight:700;margin-top:6px;color:"+(draw?"var(--gold)":"var(--gr)")},tag));}
      box.appendChild(row);
    });
    body.appendChild(box);
  });
}

// ===== ABA PALPITES =====
function verPalpites(body){
  sec(body,"eye","Conferir Palpites","Placares da fase de grupos apostados por cada um");
  const t=ce("div",{style:"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"});
  PLAYERS.forEach(p=>{const b=ce("button",{class:"tbtn"+(state.vp===p?" on":""),style:"flex:0 0 auto"});b.innerHTML=avt(p,24)+' '+p;b.onclick=()=>{state.vp=p;render();};t.appendChild(b);});
  body.appendChild(t);
  const p=state.vp,g=pg(p);
  if(!DB.imported[p]){body.appendChild(ce("div",{class:"card",style:"text-align:center;color:var(--mut);padding:24px"},p+" ainda não importado."));return;}
  const fM=M.filter(m=>{const x=g.matches[m[0]]||g.matches["m"+m[0]];return x&&x.h!==""&&x.a!=="";}).length;
  const s=scoreTotal(p);
  body.appendChild(ce("div",{class:"card",style:"margin-bottom:14px;font-size:13px"},'<b>'+p+'</b> · '+fM+'/72 placares · <span style="color:var(--grd);font-weight:800">'+s.grupos.pts+' pts</span> nos grupos'));
  [1,2,3].forEach(rod=>{
    const jogosRod=M.filter(m=>roundOf(m[0])===rod);
    const done=jogosRod.filter(m=>{const x=g.matches[m[0]]||g.matches["m"+m[0]];return x&&x.h!==""&&x.a!=="";}).length;
    const open=accordionHead(body,rod+"ª RODADA",rod,state.openRounds,done+"/"+jogosRod.length);
    if(!open)return;
    const box=ce("div",{style:"display:grid;gap:5px"});
    jogosRod.forEach(m=>{
      const gm=g.matches[m[0]]||g.matches["m"+m[0]]||{};
      const hasGuess=gm.h!==""&&gm.h!=null&&gm.a!==""&&gm.a!=null;
      const rm=DB.results.matches[m[0]]||DB.results.matches["m"+m[0]]||{};
      const hasResult=rm.h!==""&&rm.h!=null&&rm.a!==""&&rm.a!=null;
      let badge="",badgeColor="var(--mut)";
      if(hasGuess&&hasResult){
        const gh=+gm.h,ga=+gm.a,rh=+rm.h,ra=+rm.a;
        if(gh===rh&&ga===ra){badge="✅ exato!";badgeColor="var(--gr)";}
        else if((gh>ga&&rh>ra)||(gh<ga&&rh<ra)||(gh===ga&&rh===ra)){badge="✓ desfecho";badgeColor="var(--blue,#1b6fb5)";}
        else{badge="✗ errou";badgeColor="#c0392b";}
      }
      const row=ce("div",{class:"card",style:"padding:8px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap"});
      row.appendChild(ce("span",{style:"font-size:10px;color:var(--mut);min-width:28px"},"G"+m[1]));
      row.appendChild(ce("span",{style:"flex:1;font-size:13px;font-weight:700;text-align:right"},m[2]));
      row.appendChild(ce("span",{style:"font-size:16px"},fl(m[2])));
      row.appendChild(ce("span",{style:"font-size:15px;font-weight:800;min-width:52px;text-align:center;background:var(--soft);border-radius:8px;padding:4px 8px"},hasGuess?gm.h+" × "+gm.a:"– × –"));
      row.appendChild(ce("span",{style:"font-size:16px"},fl(m[3])));
      row.appendChild(ce("span",{style:"flex:1;font-size:13px;font-weight:700"},m[3]));
      if(badge)row.appendChild(ce("span",{style:"font-size:11px;font-weight:700;color:"+badgeColor},badge));
      box.appendChild(row);
    });
    body.appendChild(box);
  });
}

// ===== ABA APOSTAS DA 2ª FASE =====
function apostasPassaria(body){
  const faseOpts=[
    {k:"r32",l:"16-avos"},{k:"r16",l:"Oitavas"},{k:"r8",l:"Quartas"},
    {k:"r4",l:"Semifinal"},{k:"r2",l:"Final"},{k:"champ",l:"Campeão"},

    head.innerHTML=avt(p,32)+'<span style="font-size:14px;font-weight:800;flex:1">'+p+'</span>';
    const lista=CHAV_PALPITES[p]?.[fase]||[];
    const acertos=lista.filter(t=>reaisSet.has(t)).length;
    if(temReal)head.innerHTML+='<span style="font-size:12px;font-weight:800;color:var(--grd);background:var(--soft);padding:2px 8px;border-radius:999px">+'+(acertos*ptsFase)+'pts</span>';
    card.appendChild(head);
    if(!lista.length){
      card.appendChild(ce("div",{style:"font-size:12px;color:var(--mut);font-style:italic"},"Aguardando esta fase"));
    } else {
      lista.forEach(t=>{
        const acertou=temReal&&reaisSet.has(t);
        const errou=temReal&&!reaisSet.has(t);
        const row=ce("div",{style:"display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px"});

      });
    }
    grid.appendChild(card);
  });
  body.appendChild(grid);
}

// 16-avos: tabela por grupo (times nas linhas, jogadores nas colunas)
function apostasPassaria16(body){
  body.appendChild(ce("div",{class:"card",style:"margin-bottom:14px;font-size:12.5px;color:var(--mut);text-align:center;padding:10px"},
    "✓ = passou e o apostador acertou · marcação verde = quem realmente passou (2 pts cada acerto)"));

  GL.forEach(L=>{
    const passou=PASSOU_REAL[L]||[];
    const card=ce("div",{class:"card",style:"margin-bottom:12px;padding:0;overflow:hidden"});
    // Cabeçalho do grupo
    const gh=ce("div",{style:"background:var(--grd);color:#fff;padding:8px 12px;font-weight:800;font-size:13px"},"Grupo "+L);
    card.appendChild(gh);
    // Tabela
    const tbl=ce("table",{class:"grupo-tbl"});
    // header row
    let thead='<tr style="background:var(--soft)"><th style="text-align:left;padding:7px 10px;font-size:11px;color:var(--grd)">Time</th>';
    PLAYERS.forEach(p=>{thead+='<th style="padding:7px 4px;width:46px"><img src="'+AVATAR[p]+'" title="'+p+'" style="width:26px;height:26px;border-radius:50%;object-fit:cover"></th>';});
    thead+='</tr>';
    tbl.innerHTML=thead;
    // linhas de cada time do grupo
    GROUPS[L].forEach(t=>{
      const realPassou=passou.includes(t);
      let tr='<tr style="border-top:1px solid var(--line)'+(realPassou?';background:#eaf7ea':'')+'">';
      tr+='<td style="padding:7px 10px;font-weight:'+(realPassou?'800':'600')+'"><span style="font-size:15px">'+fl(t)+'</span> '+t+(realPassou?' <span style="font-size:10px;color:#155724;font-weight:800">PASSOU</span>':'')+'</td>';
      PLAYERS.forEach(p=>{
        const apostou=(CHAV_PALPITES[p]?.r32||[]).includes(t);
        let cell='';
        if(apostou&&realPassou)cell='<span style="color:#155724;font-weight:900;font-size:15px">✓</span>';// acertou que passa
        else if(apostou&&!realPassou)cell='<span style="color:#c0392b;font-weight:700;font-size:14px">✗</span>';// apostou mas não passou
        else if(!apostou&&realPassou)cell='<span style="color:#bbb;font-size:13px">—</span>';// passou mas não apostou
        else cell='<span style="color:#e0e0e0">·</span>';
        tr+='<td style="text-align:center;padding:7px 4px">'+cell+'</td>';
      });
      tr+='</tr>';
      tbl.innerHTML+=tr;
    });
    card.appendChild(tbl);
    body.appendChild(card);
  });

  // Legenda
  const leg=ce("div",{class:"card",style:"font-size:11.5px;color:var(--mut);padding:11px 14px;margin-top:4px"});
  leg.innerHTML='<b style="color:var(--grd)">Legenda:</b> <span style="color:#155724;font-weight:900">✓</span> acertou (apostou e passou) · <span style="color:#c0392b;font-weight:700">✗</span> apostou mas não passou · <span style="color:#bbb">—</span> passou mas não apostou';
  body.appendChild(leg);
}

// ===== BOOT =====
let jaInjetou=false;
function injetarPalpites16(){
  if(jaInjetou)return;
  // Só injeta DEPOIS que o Firebase trouxe dados reais — evita zerar palpites
  const temDadosReais=Object.keys(DB.imported||{}).length>0&&Object.keys(DB.guesses||{}).length>0;
  if(!temDadosReais)return;
  jaInjetou=true;
  ensure();
  let mudou=false;
  if(!DB.results.ko2)DB.results.ko2={};
  if(!DB.results.ko2.r32)DB.results.ko2.r32={};
  if(DB.results.ko2.r32[1]==null){DB.results.ko2.r32[1]={h:0,a:1,pen:null};mudou=true;}
  if(!DB.results.ko)DB.results.ko={};
  if(!DB.results.ko.r32)DB.results.ko.r32={};
  if(!DB.results.ko.r32[1]){DB.results.ko.r32[1]="Canadá";mudou=true;}
  // Palpites dos 16-avos — NUNCA cria guesses vazio; só adiciona em quem já foi importado
  PLAYERS.forEach(p=>{
    if(!DB.guesses[p]||!DB.imported[p])return;
    if(!DB.guesses[p].bracket2)DB.guesses[p].bracket2={};
    if(!DB.guesses[p].bracket2.r32)DB.guesses[p].bracket2.r32={};
    const meus=PALPITES_16AVOS[p]||{};
    Object.keys(meus).forEach(jid=>{
      if(DB.guesses[p].bracket2.r32[jid]==null){DB.guesses[p].bracket2.r32[jid]=meus[jid];mudou=true;}
    });
    // Palpites das oitavas
    if(!DB.guesses[p].bracket2.r16)DB.guesses[p].bracket2.r16={};
    const meusOit=(typeof PALPITES_OITAVAS!=="undefined"?PALPITES_OITAVAS[p]:null)||{};
    Object.keys(meusOit).forEach(jid=>{
      if(DB.guesses[p].bracket2.r16[jid]==null){DB.guesses[p].bracket2.r16[jid]=meusOit[jid];mudou=true;}
    });
  });
  if(mudou)pushDB();
  render();
}

startSync();
let tentativas=0;
const injInterval=setInterval(()=>{
  tentativas++;
  injetarPalpites16();
  if(jaInjetou||tentativas>10)clearInterval(injInterval);
},1500);
setTimeout(()=>fetchAPI(true),2500);
setInterval(()=>fetchAPI(true),300000);
</script>
