<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bolão da Copa 2026 — Raphael, Danillo, Lucas e Paulo</title>
<style>
  :root{--gr:#1b2e5f;--grd:#13224a;--grl:#2f4a86;--gold:#c98a0e;--ink:#142036;--mut:#5d6675;--paper:#eef1f6;--card:#fff;--line:#d6dbe6;--soft:#e3ecf8;--radius:14px;--blue:#73b4e9;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.5;}
  .wrap{max-width:920px;margin:0 auto;padding:16px 14px 48px;}
  h1,h2{font-weight:700;margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select{font-family:inherit;font-size:15px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .hidden{display:none!important;}
  .hero{position:relative;overflow:hidden;border-radius:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(27,46,95,.22);line-height:0;}
  .hero img{width:100%;height:auto;display:block;}
  .bunting{font-size:16px;letter-spacing:2px;margin-bottom:8px;}
  .eyebrow{margin:0;letter-spacing:3px;font-size:11px;font-weight:700;opacity:.85;}
  .hero h1{font-size:25px;margin:4px 0 6px;line-height:1.1;}
  .hero p.sub{margin:8px 0 0;font-size:12.5px;opacity:.85;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{flex:1 1 auto;border-radius:11px;padding:11px 8px;font-size:13px;font-weight:700;background:var(--card);color:var(--mut);border:1px solid var(--line);}
  .tabs button.on{background:var(--gr);color:#fff;border-color:transparent;}
  .sec{display:flex;align-items:center;gap:9px;margin-bottom:3px;}
  .sec .ic{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--grd);display:inline-flex;align-items:center;justify-content:center;font-size:17px;}
  .sec h2{font-size:19px;}
  .subt{margin:0 0 16px;font-size:13px;color:var(--mut);padding-left:37px;}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--gr);color:#fff;border-radius:11px;padding:11px 17px;font-weight:800;font-size:14px;}
  .btn.ghost{background:var(--soft);color:var(--grd);}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--grd);background:var(--soft);padding:8px 14px;border-radius:999px;}
  .round{display:flex;align-items:center;gap:9px;margin:14px 0 11px;}
  .round .tag{font-size:12px;font-weight:800;color:#fff;background:var(--grd);padding:3px 11px;border-radius:999px;}
  .round .line{flex:1;height:1px;background:var(--line);}
  .match{padding:11px 13px;}
  .match.done{border-left:3px solid var(--gr);}
  .meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:9px;flex-wrap:wrap;}
  .meta .g{background:var(--soft);color:var(--grd);border-radius:8px;padding:2px 7px;}
  .mrow{display:flex;align-items:center;gap:8px;justify-content:center;}
  .side{flex:1;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;}
  .side.l{justify-content:flex-end;text-align:right;}
  .side.r{justify-content:flex-start;}
  .fl{font-size:21px;line-height:1;}
  .sc{width:42px;height:42px;text-align:center;font-size:17px;font-weight:800;border:1.5px solid var(--line);border-radius:10px;background:#fafbfa;color:var(--ink);}
  .sc:disabled{background:#f0f2f0;color:var(--mut);}
  .x{color:var(--mut);font-weight:800;}
  .rk{display:flex;align-items:center;gap:14px;padding:15px 16px;}
  .rk.lead{border:2px solid var(--gold);}
  .rk .medal{font-size:27px;min-width:40px;text-align:center;}
  .rk .av{width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;overflow:hidden;}
  .rk.lead .av{border:3px solid var(--gold);}
  .rk .pts{font-size:31px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .rk .barmini{height:6px;background:var(--soft);border-radius:999px;margin-top:8px;overflow:hidden;}
  .rk .barmini>i{display:block;height:100%;border-radius:999px;}
  .rule{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;}
  .rule .lft{display:flex;align-items:center;gap:11px;font-size:14px;}
  .rule .ric{width:31px;height:31px;border-radius:9px;background:var(--soft);color:var(--grd);display:inline-flex;align-items:center;justify-content:center;font-size:16px;}
  .rule .pts{font-size:17px;font-weight:800;color:var(--gr);white-space:nowrap;margin-left:12px;}
  .api input,.imp input{padding:11px 13px;border-radius:10px;border:1px solid var(--line);}
  .foot{text-align:center;color:var(--mut);font-size:12px;padding:26px 0 6px;}
  .teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:16px;}
  .tbtn{display:flex;align-items:center;gap:7px;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:700;background:#fff;color:var(--ink);border:1px solid var(--line);}
  .tbtn.on{background:var(--gr);color:#fff;border-color:transparent;}
  .imported{font-size:12px;color:var(--grd);background:var(--soft);padding:2px 8px;border-radius:999px;font-weight:700;}
  .ko{display:flex;align-items:center;gap:8px;padding:9px 12px;margin-bottom:7px;}
  .ko .slot{flex:1;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:#fafbfa;font-weight:700;font-size:13px;cursor:pointer;}
  .ko .slot.win{background:var(--soft);border-color:var(--gr);color:var(--grd);}
  .ko .slot.empty{color:var(--mut);font-weight:500;font-style:italic;cursor:default;}
  .ko .vs{font-size:11px;color:var(--mut);font-weight:700;}
  .banner{background:#fff7e6;border:1px solid var(--gold);border-radius:10px;padding:11px 14px;font-size:13px;color:#7a5a08;margin-bottom:14px;}
  /* ===== MOBILE: telas até 640px ===== */
  @media(max-width:640px){
    .wrap{padding:12px 11px 40px;}
    .hero{border-radius:16px;}
    /* abas em grade 3x2, toque grande */
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
    .tabs button{padding:13px 6px;font-size:12.5px;min-height:46px;border-radius:12px;}
    .sec h2{font-size:17px;}
    .subt{font-size:12.5px;padding-left:0;margin-top:6px;}
    /* jogos: empilha rótulo em cima, confronto embaixo, inputs grandes */
    .match{padding:12px;}
    .mrow{gap:6px;}
    .side{font-size:13px;gap:5px;}
    .fl{font-size:19px;}
    .sc{width:46px;height:46px;font-size:18px;}
    /* ranking mais compacto */
    .rk{gap:10px;padding:14px 13px;}
    .rk .medal{font-size:23px;min-width:32px;}
    .rk .av{width:38px;height:38px;font-size:14px;}
    .rk .pts{font-size:27px;}
    /* mata-mata: confronto empilha pra caber, toques grandes */
    .ko{flex-wrap:wrap;padding:11px;}
    .ko>div:first-child{flex:0 0 100%;margin-bottom:6px;}
    .ko .slot{min-height:46px;padding:11px 12px;font-size:13.5px;}
    .ko .vs{flex:0 0 100%;text-align:center;order:2;margin:2px 0;}
    .ko select{min-height:44px;font-size:14px;}
    /* grids de time: 2 colunas no celular, toque maior */
    .teamgrid{grid-template-columns:1fr 1fr;gap:7px;}
    .tbtn{min-height:44px;padding:10px;}
    /* botões e inputs de toque maior */
    .btn{padding:13px 18px;min-height:48px;}
    .api input,.imp input{min-height:46px;font-size:16px;}
    select{min-height:44px;font-size:16px;}
    /* impede zoom indesejado no foco de input no iOS (font-size>=16px já ajuda) */
  }
  /* telas muito estreitas (iPhone SE ~375px) */
  @media(max-width:380px){
    .tabs{grid-template-columns:repeat(2,1fr);}
    .teamgrid{grid-template-columns:1fr;}
    .side span:not(.fl){font-size:12px;}
  }
</style>

function matchTeam(raw){if(!raw)return null;let s=NORM(raw);if(TBN[s])return TBN[s];for(const t of ALL){const n=NORM(t);if(n&&(s.includes(n)||n.includes(s)))return t;}return null;}
const roundOf=id=>{const n=+(""+id).replace(/\D/g,"");return n<=24?1:n<=48?2:3;};

// pontos por fase (para PALPITES dos jogadores: acerto de quem chega em cada fase)
const PH=[{k:"r32",label:"Mata-mata (32)",n:32,pts:2},{k:"r16",label:"Oitavas (16)",n:16,pts:4},{k:"r8",label:"Quartas (8)",n:8,pts:6},{k:"r4",label:"Semis (4)",n:4,pts:8},{k:"r2",label:"Final (2)",n:2,pts:10},{k:"champ",label:"Campeão (1)",n:1,pts:20}];

// ---- BRACKET (resultados reais, em cascata) ----
// Rodada 1 (32->16): 16 jogos definidos em OITAVAS (com lados pos/3rd)
// Rodadas seguintes pareiam vencedores na ordem do colchete.
const R1=OITAVAS; // 16 jogos
const R2=Array.from({length:8},(_,i)=>({id:i+1,a:2*i+1,b:2*i+2})); // 16->8 (oitavas), vencedores dos jogos R1
const R3=Array.from({length:4},(_,i)=>({id:i+1,a:2*i+1,b:2*i+2})); // 8->4 (quartas), vencedores R2
const R4=Array.from({length:2},(_,i)=>({id:i+1,a:2*i+1,b:2*i+2})); // 4->2 (semis), vencedores R3
const R5=[{id:1,a:1,b:2}]; // final, vencedores R4
const ROUNDS=[
  {key:"k1",label:"2ª fase — 16 jogos (32→16)",games:R1,phaseKey:"r16"}, // vencedores aqui = os 16
  {key:"k2",label:"Oitavas — 8 jogos (16→8)",games:R2,phaseKey:"r8"},
  {key:"k3",label:"Quartas — 4 jogos (8→4)",games:R3,phaseKey:"r4"},
  {key:"k4",label:"Semifinais — 2 jogos (4→2)",games:R4,phaseKey:"r2"},
  {key:"k5",label:"Final (2→campeão)",games:R5,phaseKey:"champ"},
];

// resolve o "lado" de um jogo da R1 conforme placares/quem-avançou dos grupos (lado pos) ou manual (3rd)
function r1SideTeam(side, results){
  if(side.t==="pos"){
    const st=standings(results.matches||{});
    const team=st.byGroup[side.g] ? st.byGroup[side.g][side.p-1] : null;
    return team||null;
  }
  return null; // 3rd: definido manualmente em results.r1thirds[jogo]
}

// ---- classificação dos grupos a partir de placares ----
function standings(matches){
  const stat={}; ALL.forEach(t=>stat[t]={p:0,v:0,e:0,d:0,gp:0,gc:0});
  M.forEach(m=>{
    const r=matches[m[0]]||matches["m"+m[0]]; if(!r)return;
    const h=r.h,a=r.a; if(h===""||a===""||h==null||a==null)return;
    const H=+h,A=+a,th=m[2],ta=m[3];
    stat[th].gp+=H;stat[th].gc+=A;stat[ta].gp+=A;stat[ta].gc+=H;stat[th].p++;stat[ta].p++;
    if(H>A){stat[th].v++;stat[ta].d++;}else if(H<A){stat[ta].v++;stat[th].d++;}else{stat[th].e++;stat[ta].e++;}
  });
  const rawscore=t=>{const s=stat[t];return (3*s.v+s.e)*1e7+((s.gp-s.gc)+100)*1e4+s.gp*10;};
  const byGroup={},posByGroup={};
  GL.forEach(L=>{
    const arr=GROUPS[L].map((t,i)=>({t,sc:rawscore(t)+(4-i)}));
    arr.sort((x,y)=>y.sc-x.sc);
    byGroup[L]=arr.map(o=>o.t); posByGroup[L]={}; arr.forEach((o,idx)=>posByGroup[L][o.t]=idx+1);
  });
  return {stat,score:rawscore,byGroup,posByGroup};
}
function compute32(matches){
  const st=standings(matches); const top2=[],thirds=[];
  GL.forEach(L=>{top2.push(st.byGroup[L][0],st.byGroup[L][1]);const th=st.byGroup[L][2];thirds.push({t:th,sc:st.score(th)});});
  thirds.sort((a,b)=>b.sc-a.sc);
  return top2.concat(thirds.slice(0,8).map(o=>o.t));
}

// ===== resolver o bracket REAL (cascata) =====
// retorna {teamsR1:{jogoId:[teamA,teamB]}, winners por rodada, phaseTeams:{r16:[...16],r8:[...],...}}
function resolveBracket(){
  ensure();
  const st=standings(DB.results.matches);
  // lados da R1
  const r1=[];
  R1.forEach(g=>{
    let A = g.l.t==="pos" ? (st.byGroup[g.l.g]?st.byGroup[g.l.g][g.l.p-1]:null) : (DB.results.r1thirds["L"+g.id]||null);
    let B = g.r.t==="pos" ? (st.byGroup[g.r.g]?st.byGroup[g.r.g][g.r.p-1]:null) : (DB.results.r1thirds["R"+g.id]||null);
    r1.push({id:g.id,A,B});
  });
  // vencedores escolhidos
  const W={k1:{},k2:{},k3:{},k4:{},k5:{}};
  Object.assign(W.k1, DB.results.winners.k1||{});
  Object.assign(W.k2, DB.results.winners.k2||{});
  Object.assign(W.k3, DB.results.winners.k3||{});
  Object.assign(W.k4, DB.results.winners.k4||{});
  Object.assign(W.k5, DB.results.winners.k5||{});
  // times de cada rodada seguinte = vencedores da anterior
  const teamsByRound={k1:{}}; r1.forEach(j=>teamsByRound.k1[j.id]=[j.A,j.B]);
  function nextTeams(prevKey,games){
    const tt={};
    games.forEach(g=>{tt[g.id]=[W[prevKey][g.a]||null, W[prevKey][g.b]||null];});
    return tt;
  }
  teamsByRound.k2=nextTeams("k1",R2);
  teamsByRound.k3=nextTeams("k2",R3);
  teamsByRound.k4=nextTeams("k3",R4);
  teamsByRound.k5=nextTeams("k4",R5);
  // phaseTeams para pontuação: r16 = vencedores k1 (16), r8 = vencedores k2 (8), etc.
  const phaseTeams={
    r32: compute32(DB.results.matches),
    r16: Object.values(W.k1).filter(Boolean),
    r8: Object.values(W.k2).filter(Boolean),
    r4: Object.values(W.k3).filter(Boolean),
    r2: Object.values(W.k4).filter(Boolean),
    champ: Object.values(W.k5).filter(Boolean),
  };
  return {r1,teamsByRound,W,phaseTeams};
}

// ===== pontuação =====
const bsel=(o,k)=>{const v=o&&o[k];return Array.isArray(v)?v:[];};
function scoreOf(p){
  const g=pg(p); let mp=0,ex=0,hit=0,bp=0;
  // placares grupos
  M.forEach(m=>{const gm=g.matches[m[0]]||g.matches["m"+m[0]];const rm=DB.results.matches[m[0]]||DB.results.matches["m"+m[0]];
    if(gm&&rm&&rm.h!==""&&rm.a!==""&&rm.h!=null&&gm.h!==""&&gm.a!==""&&gm.h!=null){
      const gh=+gm.h,ga=+gm.a,rh=+rm.h,ra=+rm.a;
      if(gh===rh&&ga===ra){mp+=5;ex++;hit++;}
      else if((gh>ga&&rh>ra)||(gh<ga&&rh<ra)||(gh===ga&&rh===ra)){mp+=2;hit++;}
    }});
  // bracket: comparar palpite (g.bracket) com real (resolveBracket().phaseTeams)
  const real=resolveBracket().phaseTeams;
  const bd={};
  PH.forEach(ph=>{
    const guess=bsel(g.bracket,ph.k), rset=new Set(real[ph.k]||[]);
    let acc=0; guess.forEach(t=>{if(rset.has(t))acc++;});
    bd[ph.k]=acc*ph.pts; bp+=acc*ph.pts;
  });
  return {total:mp,mp,bp,ex,hit,bd};
}

// ===== PARSER do Excel (novo formato: Placares + Mata-mata) =====
function parseWorkbook(wb){
  const matches={},bracket={};let nM=0,nB=0;
  const wsP=wb.Sheets["Placares"];
  if(wsP){const rows=XLSX.utils.sheet_to_json(wsP,{header:1,defval:""});
    rows.forEach(row=>{const num=row[0];
      if(typeof num==="number"&&num>=1&&num<=72){const gm=row[4],gv=row[5];
        if(gm!==""&&gm!=null&&gv!==""&&gv!=null){matches["m"+num]={h:String(gm).replace(/[^\d]/g,""),a:String(gv).replace(/[^\d]/g,"")};if(matches["m"+num].h!==""&&matches["m"+num].a!=="")nM++;}}});
  }
  // os 32 do palpite saem CALCULADOS dos placares (não estão digitados)
  bracket.r32=compute32(matches);
  // 16,8,4,2,campeão: da aba Mata-mata (escolha manual)
  const wsM=wb.Sheets["Mata-mata"];
  if(wsM){const rows=XLSX.utils.sheet_to_json(wsM,{header:1,defval:""});
    let cur=null,acc=[];
    const phaseFromHeader=a=>{if(/^16/.test(a)||/oitavas/i.test(a))return "r16";if(/^8/.test(a)||/quartas/i.test(a))return "r8";if(/^4/.test(a)||/semi/i.test(a))return "r4";if(/^2/.test(a)||/final/i.test(a))return "r2";if(/campe/i.test(a))return "champ";return null;};
    const flush=()=>{if(cur){bracket[cur]=acc.slice();nB+=acc.length;}};
    rows.forEach(row=>{const a=(row[0]||"").toString();const b=(row[1]||"").toString().trim();
      if(/pts por acerto/i.test(a)){flush();cur=phaseFromHeader(a);acc=[];return;}
      if(cur&&b&&b!=="Time que avança"){const t=matchTeam(b);if(t&&acc.indexOf(t)<0)acc.push(t);}});
    flush();
  }
  return {matches,bracket,nM,nB};
}
async function handleFile(file,player){
  if(!file)return; state.impMsg="Lendo "+player+"…";render();
  try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array"});const p=parseWorkbook(wb);
    const g=pg(player);g.matches=p.matches;g.bracket=p.bracket;
    DB.imported[player]=true;pushDB();
    state.impMsg="✓ "+player+": "+p.nM+" placares lidos · 32 calculados · "+p.nB+" escolhas de mata-mata.";
  }catch(e){console.error(e);state.impMsg="Erro ao ler "+player+". Confira o arquivo e as abas Placares/Mata-mata.";}
  render();
}

      row.appendChild(ce("span",{class:"fl",style:"font-size:16px"},fl(m[3])));

      if(badge)row.appendChild(ce("span",{style:"font-size:11px;font-weight:700;color:"+badgeColor},badge));
      box.appendChild(row);});
    body.appendChild(box);
  });
}

function grupos(body){
  if(isAdmin){
    sec(body,"📊","Grupos — resultados reais","Modo admin: edite placares ou atualize pela API.");
    const api=ce("div",{class:"card api",style:"margin-bottom:16px;border:1px dashed var(--line)"});
    api.appendChild(ce("div",{style:"font-weight:700;font-size:14px;margin-bottom:6px"},"⚡ Placares automáticos (API-Football)"));
    api.appendChild(ce("p",{style:"font-size:12.5px;color:var(--mut);margin:0 0 12px"},"Busca sozinho ao abrir. Toque para forçar atualização agora."));
    const ar=ce("div",{style:"display:flex;gap:8px;flex-wrap:wrap"});
    const btn=ce("button",{class:"btn"},state.saving?"Buscando…":"🔄 Atualizar resultados");btn.onclick=()=>fetchAPI(false);ar.appendChild(btn);api.appendChild(ar);
    if(state.apiMsg)api.appendChild(ce("p",{style:"font-size:13px;margin:12px 0 0;font-weight:700;color:"+(state.apiMsg[0]==="✓"?"var(--grd)":"var(--mut)")},state.apiMsg));
    body.appendChild(api);
  } else {
    sec(body,"📊","Grupos — resultados","Classificação e placares atualizados automaticamente.");
  }
  // mini-tabelas de classificação
  const st=standings(DB.results.matches);
  GL.forEach(L=>{
    body.appendChild(ce("div",{class:"round"},'<span class="tag">Grupo '+L+'</span><span class="line"></span>'));
    const tbl=ce("div",{class:"card",style:"padding:8px 12px;margin-bottom:6px"});
    st.byGroup[L].forEach((t,idx)=>{const s=st.stat[t];const pts=3*s.v+s.e;
      const cls=idx<2?"color:var(--grd);font-weight:800":"color:var(--ink)";
      tbl.appendChild(ce("div",{style:"display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;"+cls},
        '<span style="width:18px;text-align:center">'+(idx+1)+'</span><span style="font-size:16px">'+fl(t)+'</span><span style="flex:1">'+t+'</span><span style="font-size:11px;color:var(--mut)">'+s.v+'V '+s.e+'E '+s.d+'D · SG '+(s.gp-s.gc>=0?'+':'')+(s.gp-s.gc)+'</span><span style="width:34px;text-align:right;font-weight:800">'+pts+' pt</span>'));});
    body.appendChild(tbl);
  });
  // jogos — admin pode editar, visitante só vê
  [1,2,3].forEach(rod=>{
    body.appendChild(ce("div",{class:"round"},'<span class="tag">'+rod+'ª RODADA</span><span class="line"></span>'));
    const box=ce("div",{style:"display:grid;gap:7px"});
    M.filter(m=>roundOf(m[0])===rod).forEach(m=>{const r=DB.results.matches[m[0]]||{};const done=r.h!==""&&r.a!==""&&r.h!=null&&r.a!=null;
      const row=ce("div",{class:"card match"+(done?" done":"")});row.appendChild(ce("div",{class:"meta"},'<span class="g">G'+m[1]+'</span><span>'+m[4]+' · '+m[5]+'</span>'));
      const mid=ce("div",{class:"mrow"});
      const H=done?+r.h:null,A=done?+r.a:null;
      const winH=done&&H>A, winA=done&&A>H, draw=done&&H===A;
      const sH=winH?"font-weight:900;color:var(--gr)":draw?"font-weight:700;color:var(--gold)":"";
      const sA=winA?"font-weight:900;color:var(--gr)":draw?"font-weight:700;color:var(--gold)":"";
      mid.appendChild(ce("span",{class:"side l",style:sH},'<span>'+m[2]+'</span><span class="fl">'+fl(m[2])+'</span>'));
      if(isAdmin){
        const i1=ce("input",{class:"sc",type:"text",inputmode:"numeric",maxlength:"2"});i1.value=r.h==null?"":r.h;
        i1.oninput=function(){this.value=this.value.replace(/[^\d]/g,"").slice(0,2);if(!DB.results.matches[m[0]])DB.results.matches[m[0]]={};DB.results.matches[m[0]].h=this.value;pushDB();};
        const i2=ce("input",{class:"sc",type:"text",inputmode:"numeric",maxlength:"2"});i2.value=r.a==null?"":r.a;
        i2.oninput=function(){this.value=this.value.replace(/[^\d]/g,"").slice(0,2);if(!DB.results.matches[m[0]])DB.results.matches[m[0]]={};DB.results.matches[m[0]].a=this.value;pushDB();};
        mid.appendChild(i1);mid.appendChild(ce("span",{class:"x"},"×"));mid.appendChild(i2);
      } else {
        const scStyle=s=>winH&&s==="h"?";background:var(--soft);border-color:var(--gr);color:var(--gr)":winA&&s==="a"?";background:var(--soft);border-color:var(--gr);color:var(--gr)":draw?";background:#fff8e6;border-color:var(--gold);color:var(--gold)":"";
        mid.appendChild(ce("span",{class:"sc",style:"display:inline-flex;align-items:center;justify-content:center"+scStyle("h")},done?r.h:"–"));
        mid.appendChild(ce("span",{class:"x"},"×"));
        mid.appendChild(ce("span",{class:"sc",style:"display:inline-flex;align-items:center;justify-content:center"+scStyle("a")},done?r.a:"–"));
      }
      mid.appendChild(ce("span",{class:"side r",style:sA},'<span class="fl">'+fl(m[3])+'</span><span>'+m[3]+'</span>'));
      row.appendChild(mid);
      if(done){const tag=draw?"Empate":winH?m[2]+" venceu":m[3]+" venceu";row.appendChild(ce("div",{style:"text-align:center;font-size:11px;font-weight:700;margin-top:6px;color:"+(draw?"var(--gold)":"var(--gr)")},tag));}
      box.appendChild(row);});
    body.appendChild(box);
  });
}

// ===== MATA-MATA em cascata (resultados reais) =====
function mata(body){
  const popup=ce("div",{style:"text-align:center;padding:60px 20px"});
  popup.appendChild(ce("div",{style:"font-size:52px;margin-bottom:16px"},"🏟️"));
  popup.appendChild(ce("div",{style:"font-size:22px;font-weight:800;color:var(--gr);margin-bottom:10px"},"Em breve..."));
  popup.appendChild(ce("div",{style:"font-size:14px;color:var(--mut);line-height:1.6"},"O mata-mata será liberado quando a fase de grupos terminar.<br>Fique ligado!"));
  body.appendChild(ce("div",{class:"card"},popup.outerHTML));
}
function clearDownstream(){
  // recalcula validade: remove vencedores que não fazem mais parte dos confrontos
  const br=resolveBracket();
  ["k2","k3","k4","k5"].forEach((k,idx)=>{
    const games=[R2,R3,R4,R5][idx];
    if(!DB.results.winners[k])return;
    Object.keys(DB.results.winners[k]).forEach(gid=>{
      const tt=br.teamsByRound[k][gid]||[];
      if(!tt.includes(DB.results.winners[k][gid]))delete DB.results.winners[k][gid];
    });
  });
}

async function fetchAPI(silent){
  if(!silent){state.saving=true;state.apiMsg="Buscando…";render();}
  try{const res=await fetch("https://v3.football.api-sports.io/fixtures?league=1&season=2026",{headers:{"x-apisports-key":API_KEY}});const data=await res.json();
    if(!data.response||!data.response.length){if(!silent){state.apiMsg="Sem jogos finalizados ainda.";state.saving=false;render();}return;}
    function apiTeam(name){const n=NORM(name);if(API_NAMES[n])return API_NAMES[n];if(TBN[n])return TBN[n];for(const k in API_NAMES){if(n.includes(k)||k.includes(n))return API_NAMES[k];}return null;}
    let count=0;
    data.response.forEach(fx=>{if(!fx.fixture||fx.fixture.status.short!=="FT")return;if(fx.goals.home==null||fx.goals.away==null)return;
      const home=apiTeam(fx.teams.home.name),away=apiTeam(fx.teams.away.name);
      if(!home||!away)return;
      const t=M.find(m=>m[2]===home&&m[3]===away);
      if(t){DB.results.matches[t[0]]={h:String(fx.goals.home),a:String(fx.goals.away)};count++;}});
    if(count>0)pushDB();
    if(!silent){state.apiMsg=count>0?("✓ "+count+" jogo(s) preenchido(s)."):"Nenhum jogo finalizado ainda.";state.saving=false;render();}
    else if(count>0)render();
  }catch(e){if(!silent){state.apiMsg="Falha na API. Tente de novo em alguns minutos.";state.saving=false;render();}}
}

  const info=ce("div",{class:"card",style:"margin-top:16px;font-size:13.5px;color:var(--mut);line-height:1.6"});
  info.innerHTML='<b style="color:var(--ink)">Pontuação:</b> vale só a fase de grupos. Acertar o placar exato = 5 pts. Acertar quem vence (ou o empate) = 2 pts.<br><br><b style="color:var(--ink)">Mata-mata:</b> os palpites de quem avança continuam na planilha e no site pra acompanhar, mas não somam no ranking.<br><br><b style="color:var(--ink)">Fluxo:</b> importe as planilhas (palpites). Os placares dos grupos entram pela API ou na mão. O ranking calcula sozinho.';body.appendChild(info);
}
